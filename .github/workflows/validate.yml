name: Validate OpenSCAD Skill

on:
  push:
    branches: [main]
    paths: ['**.scad', '**.md', '**.py', '**.ps1', '**.sh', '.github/workflows/validate.yml']
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Install OpenSCAD (macOS)
        if: runner.os == 'macOS'
        run: brew install openscad

      - name: Install OpenSCAD (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install openscad --yes --no-progress

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python tooling
        run: python -m pip install --upgrade pytest trimesh numpy

      - name: Check OpenSCAD version
        run: openscad --version

      - name: Run Python tests
        run: python -m pytest tests -q

      - name: Validate basic and intermediate examples
        run: python scripts/validate_scad.py "examples/basic/*.scad" "examples/intermediate/*.scad"

      - name: Validate advanced examples (informational)
        continue-on-error: true
        run: python scripts/validate_scad.py "examples/advanced/*.scad"

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: '**/*.md'
        continue-on-error: true
